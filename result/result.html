<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Results</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="result.css">
  <script src="result.js" defer></script>


</head>
<body>
  <header>
    <h1>Available Flights</h1>
  </header>

  <section class="container">
    <div class="search-summary">
      <div class="route-info">
        <h2 id="routeDisplay">DAC → BKK</h2>
        <div class="route-details">
          <p id="dateDisplay">Oct 15, 2023</p>
          <p id="passengerDisplay">1 Passenger</p>
        </div>
      </div>
      <button class="modify-search" onclick="openModifySearchModal()">
        <i class="fas fa-edit"></i> Modify Search
      </button>
    </div>
    
    <!-- Date Range Bar -->
    <div class="date-range-container">
      <div class="date-range-header">
        <h3>Explore Fares Around Your Dates</h3>
        <div class="results-count" id="dateRangeInfo">Showing 7 days</div>
      </div>
      <div class="date-range" id="dateRange">
        <!-- Date cards will be generated by JavaScript -->
      </div>
    </div>
    
    <div class="filters-section">
      <div class="filters-header">
        <h3>Filter Flights</h3>
      </div>
      <div class="filters-container">
        <div class="filter-group">
          <label for="stopsFilter">Stops</label>
          <select id="stopsFilter">
            <option value="all">Any</option>
            <option value="0">Non-stop</option>
            <option value="1">1 Stop</option>
            <option value="2">2+ Stops</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="airlinesFilter">Airlines</label>
          <select id="airlinesFilter">
            <option value="all">All Airlines</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="priceRange">Price Range</label>
          <select id="priceRange">
            <option value="all">Any Price</option>
            <option value="0-10000">Under BDT 10,000</option>
            <option value="10000-20000">BDT 10,000 - 20,000</option>
            <option value="20000-30000">BDT 20,000 - 30,000</option>
            <option value="30000+">Over BDT 30,000</option>
          </select>
        </div>
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="applyFilter('cheapest', this)">Cheapest</button>
        <button class="filter-btn" onclick="applyFilter('fastest', this)">Fastest</button>
        <button class="filter-btn" onclick="applyFilter('earliest', this)">Earliest</button>
        <button class="filter-btn" onclick="resetFilters(this)">Reset Filters</button>
      </div>
    </div>
    
    <div class="results-header">
      <div class="results-count" id="resultsCount">Loading flights...</div>
      <div class="sort-dropdown">
        <label for="sortBy">Sort by:</label>
        <select id="sortBy" onchange="sortFlights(this.value)">
          <option value="cheapest">Cheapest</option>
          <option value="fastest">Fastest</option>
          <option value="earliest">Earliest</option>
          <option value="latest">Latest</option>
        </select>
      </div>
    </div>
    
    <div id="results">
      <div class="loading">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </section>

  <!-- Notification -->
  <div class="notification" id="notification"></div>

  <!-- Modify Search Modal -->
  <div class="modal" id="modifySearchModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Modify Search</h2>
        <button class="close-btn" onclick="closeModifySearchModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="modifySearchForm">
          <div class="form-row">
            <div class="form-group">
              <label for="modalOrigin">From</label>
              <div class="input-group">
                <input type="text" id="modalOrigin" class="form-control" placeholder="City or airport code" autocomplete="off">
                <div id="modalOrigin-suggestions" class="airport-suggestions"></div>
              </div>
            </div>
            <div class="form-group">
              <label for="modalDestination">To</label>
              <div class="input-group">
                <input type="text" id="modalDestination" class="form-control" placeholder="City or airport code" autocomplete="off">
                <div id="modalDestination-suggestions" class="airport-suggestions"></div>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="modalDeparture">Departure Date</label>
              <input type="date" id="modalDeparture" class="form-control">
            </div>
            <div class="form-group">
              <label for="modalReturn">Return Date (Optional)</label>
              <input type="date" id="modalReturn" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label for="modalPassengers">Passengers</label>
            <select id="modalPassengers" class="form-control">
              <option value="1">1 Passenger</option>
              <option value="2">2 Passengers</option>
              <option value="3">3 Passengers</option>
              <option value="4">4 Passengers</option>
              <option value="5">5 Passengers</option>
              <option value="6">6 Passengers</option>
            </select>
          </div>
          <button type="button" class="btn btn-primary btn-block" onclick="updateSearch()">Update Search</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
