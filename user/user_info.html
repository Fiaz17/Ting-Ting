<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Information</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="user_info.css">
  <script src="user_info.js" defer></script>
  
</head>
<body>
  <header>
    <h1>Complete Your Booking</h1>
  </header>

  <div class="container">
    <div class="progress-bar">
      <div class="progress"></div>
    </div>
    
    <div class="step-indicator">
      <div class="step completed">
        <div class="step-circle"><i class="fas fa-check"></i></div>
        <div class="step-title">Select Flight</div>
      </div>
      <div class="step active">
        <div class="step-circle">2</div>
        <div class="step-title">Passenger Info</div>
      </div>
      <div class="step">
        <div class="step-circle">3</div>
        <div class="step-title">Confirmation</div>
      </div>
    </div>
    
    <div class="form-container">
      <div class="form-header">
        <h1>Passenger Information</h1>
        <p>Please provide your details to complete the booking</p>
      </div>
      
      <div class="flight-summary">
        <img id="airlineLogo" src="" alt="Airline Logo">
        <div class="flight-info">
          <h3 id="flightName">Flight Name</h3>
          <p id="flightRoute">Route</p>
          <p id="flightTime">Time</p>
        </div>
        <div class="price-tag" id="flightPrice">BDT 0</div>
      </div>
      
      <div class="form-body">
        <div class="notification">
          <p><i class="fas fa-info-circle"></i> Please enter your details exactly as they appear on your travel documents.</p>
        </div>
        
        <form id="passengerForm">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="firstName" class="form-control" placeholder="John" required>
              </div>
            </div>
            
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="lastName" class="form-control" placeholder="Doe" required>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-group">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" class="form-control" placeholder="john.doe@example.com" required>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" id="phone" class="form-control" placeholder="+880 1XXX XXXXXX" required>
              </div>
            </div>
            
            <div class="form-group">
              <label for="nationality">Nationality</label>
              <div class="input-group">
                <i class="fas fa-flag"></i>
                <select id="nationality" class="form-control" required>
                  <option value="">Select Nationality</option>
                  <option value="bangladeshi">Bangladeshi</option>
                  <option value="indian">Indian</option>
                  <option value="pakistani">Pakistani</option>
                  <option value="american">American</option>
                  <option value="british">British</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="passport">Passport Number</label>
            <div class="input-group">
              <i class="fas fa-passport"></i>
              <input type="text" id="passport" class="form-control" placeholder="AB1234567" required>
            </div>
          </div>
          
          <div class="btn-container">
            <a href="javascript:history.back()" class="btn btn-secondary">
              <i class="fas fa-arrow-left"></i> Back
            </a>
            <button type="submit" class="btn btn-primary">
              Continue to Payment <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
