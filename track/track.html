<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Flight Tracker</title>
  <link rel="stylesheet" href="track.css">
  <script src="track.js" defer></script>
</head>
<body>
  <div class="tracker-container">
    <h1>Live Flight Tracker</h1>
    <p>Enter your flight number to see live status:</p>
    
    <div class="search-box">
      <input type="text" id="flightInput" placeholder="e.g. EK202">
      <button id="trackBtn">Track Flight</button>
    </div>
  </div>
</body>
</html>
